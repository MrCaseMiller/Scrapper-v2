<!DOCTYPE html>
<html>
<head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      font-size: 12px;
      color: #333;
      padding: 16px;
      background: #fff;
    }

    h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1a1a1a;
    }

    .section {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #666;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .selection-badge {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      color: #666;
    }

    .selection-badge.valid {
      background: #e8f4ff;
      border-color: #18a0fb;
      color: #0d6ebd;
    }

    .selection-badge.invalid {
      background: #ffebe9;
      border-color: #f0a0a0;
      color: #cf222e;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 400;
      color: #333;
      text-transform: none;
      letter-spacing: 0;
      cursor: pointer;
      padding: 4px 0;
    }

    .checkbox-label input[type="checkbox"] {
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .depth-control {
      margin-top: 8px;
    }

    .depth-control label {
      display: inline;
      font-size: 11px;
      text-transform: none;
      letter-spacing: 0;
    }

    .depth-control input[type="range"] {
      width: 100%;
      margin-top: 4px;
    }

    textarea {
      width: 100%;
      height: 160px;
      padding: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 10px;
      line-height: 1.4;
      resize: vertical;
      background: #fafafa;
    }

    textarea:focus {
      outline: none;
      border-color: #18a0fb;
      background: #fff;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    button.primary {
      flex: 1;
      padding: 10px 16px;
      background: #18a0fb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.primary:hover {
      background: #0d8de5;
    }

    button.primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    button.secondary {
      padding: 10px 16px;
      background: #f5f5f5;
      color: #333;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    button.secondary:hover {
      background: #eee;
    }

    .message {
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 11px;
    }

    .message.success {
      background: #e6f9ed;
      color: #1a7f37;
    }

    .message.error {
      background: #ffebe9;
      color: #cf222e;
    }

    .table-prompt {
      display: none;
      margin-top: 14px;
      padding: 14px;
      background: #f0f7ff;
      border: 1px solid #c8e1ff;
      border-radius: 8px;
    }

    .table-prompt h3 {
      font-size: 12px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 10px;
    }

    .table-prompt p {
      font-size: 11px;
      color: #555;
      margin-bottom: 10px;
    }

    .viewport-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .viewport-btn {
      flex: 1;
      padding: 8px 6px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      font-size: 11px;
    }

    .viewport-btn:hover {
      border-color: #18a0fb;
      background: #f5faff;
    }

    .viewport-btn.active {
      border-color: #18a0fb;
      background: #e8f4ff;
    }

    .viewport-btn .name {
      font-weight: 600;
      color: #333;
    }

    .viewport-btn .size {
      font-size: 10px;
      color: #888;
      margin-top: 2px;
    }

    .output-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .output-actions button {
      padding: 6px 10px;
      font-size: 10px;
      border-radius: 4px;
      border: 1px solid #e0e0e0;
      background: #fff;
      cursor: pointer;
    }

    .output-actions button:hover {
      background: #f5f5f5;
    }

    .node-count {
      font-size: 10px;
      color: #888;
      font-weight: 400;
    }

    #outputSection {
      display: none;
    }
  </style>
</head>
<body>
  <h2>Section to JSON Table</h2>

  <!-- Selection info -->
  <div class="section">
    <label>Selected Node</label>
    <div id="selectionBadge" class="selection-badge">No node selected</div>
  </div>

  <!-- Extraction options -->
  <div class="section">
    <label>Extraction Options</label>
    <div class="options-grid">
      <label class="checkbox-label">
        <input type="checkbox" id="optPosition" checked> Position & Size
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="optStyles" checked> Visual Styles
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="optTextStyles" checked> Text Styles
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="optHidden"> Hidden Nodes
      </label>
    </div>
    <div class="depth-control">
      <label>Max Depth: <span id="depthValue">20</span></label>
      <input type="range" id="optDepth" min="1" max="20" value="20">
    </div>
  </div>

  <!-- Extract button -->
  <div class="btn-row">
    <button class="primary" id="extractBtn" disabled>Extract JSON</button>
    <button class="secondary" id="cancelBtn">Close</button>
  </div>

  <div id="messageArea"></div>

  <!-- JSON output -->
  <div id="outputSection">
    <div class="section" style="margin-top: 14px;">
      <label>Extracted JSON <span class="node-count" id="nodeCountBadge"></span></label>
      <textarea id="jsonOutput" readonly></textarea>
      <div class="output-actions">
        <button id="copyBtn">Copy to Clipboard</button>
        <button id="downloadBtn">Download .json</button>
      </div>
    </div>

    <!-- Table creation prompt -->
    <div class="table-prompt" id="tablePrompt">
      <h3>Create a Table from this data?</h3>
      <p>Generate a Figma table showing each node's properties as rows.</p>
      <label style="margin-bottom: 6px;">Viewport</label>
      <div class="viewport-toggle">
        <div class="viewport-btn active" data-viewport="desktop">
          <div class="name">Desktop</div>
          <div class="size">960px</div>
        </div>
        <div class="viewport-btn" data-viewport="mobile">
          <div class="name">Mobile</div>
          <div class="size">375px</div>
        </div>
      </div>
      <div class="btn-row" style="margin-top: 8px;">
        <button class="primary" id="createTableBtn">Create Table</button>
      </div>
    </div>
  </div>

  <script>
    // State
    var selectedViewport = 'desktop';
    var extractedRows = null;
    var selectionValid = false;

    // Depth slider
    var depthSlider = document.getElementById('optDepth');
    var depthValue = document.getElementById('depthValue');
    depthSlider.addEventListener('input', function() {
      depthValue.textContent = depthSlider.value;
    });

    // Viewport selection
    document.querySelectorAll('.viewport-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.viewport-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        selectedViewport = btn.dataset.viewport;
      });
    });

    // Extract button
    document.getElementById('extractBtn').addEventListener('click', function() {
      var options = {
        includePosition: document.getElementById('optPosition').checked,
        includeStyles: document.getElementById('optStyles').checked,
        includeTextStyles: document.getElementById('optTextStyles').checked,
        includeHidden: document.getElementById('optHidden').checked,
        maxDepth: parseInt(document.getElementById('optDepth').value)
      };
      parent.postMessage({ pluginMessage: { type: 'extract-section', options: options } }, '*');
      document.getElementById('messageArea').innerHTML = '<div class="message">Extracting...</div>';
    });

    // Create table button
    document.getElementById('createTableBtn').addEventListener('click', function() {
      if (!extractedRows || extractedRows.length === 0) return;
      parent.postMessage({
        pluginMessage: {
          type: 'create-table',
          rows: extractedRows,
          viewport: selectedViewport
        }
      }, '*');
    });

    // Copy to clipboard
    document.getElementById('copyBtn').addEventListener('click', function() {
      var text = document.getElementById('jsonOutput').value;
      navigator.clipboard.writeText(text).then(function() {
        showMessage('Copied to clipboard!', 'success');
      });
    });

    // Download as file
    document.getElementById('downloadBtn').addEventListener('click', function() {
      var text = document.getElementById('jsonOutput').value;
      var blob = new Blob([text], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'section-extract.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    // Cancel button
    document.getElementById('cancelBtn').addEventListener('click', function() {
      parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
    });

    // Message handler
    window.onmessage = function(event) {
      var msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'selection-update') {
        var badge = document.getElementById('selectionBadge');
        var extractBtn = document.getElementById('extractBtn');

        if (msg.valid) {
          badge.textContent = msg.nodeType + ': "' + msg.name + '"';
          badge.className = 'selection-badge valid';
          extractBtn.disabled = false;
          selectionValid = true;
        } else if (msg.name) {
          badge.textContent = msg.nodeType + ': "' + msg.name + '" (select a Section, Frame, or Group)';
          badge.className = 'selection-badge invalid';
          extractBtn.disabled = true;
          selectionValid = false;
        } else {
          badge.textContent = 'No node selected';
          badge.className = 'selection-badge';
          extractBtn.disabled = true;
          selectionValid = false;
        }
      }

      if (msg.type === 'extraction-result') {
        document.getElementById('jsonOutput').value = msg.json;
        document.getElementById('nodeCountBadge').textContent = '(' + msg.nodeCount + ' nodes)';
        document.getElementById('outputSection').style.display = 'block';
        document.getElementById('tablePrompt').style.display = 'block';
        extractedRows = msg.rows;
        showMessage('Extracted ' + msg.nodeCount + ' nodes successfully.', 'success');
      }

      if (msg.type === 'success') {
        showMessage(msg.message, 'success');
      }

      if (msg.type === 'error') {
        showMessage(msg.message, 'error');
      }
    };

    function showMessage(text, type) {
      document.getElementById('messageArea').innerHTML = '<div class="message ' + type + '">' + text + '</div>';
    }
  </script>
</body>
</html>
