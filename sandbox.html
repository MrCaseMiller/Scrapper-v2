<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ablation Studies - Graph Dashboard</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --fg: rgba(65, 62, 62, 1);
      --grid: #e8e8e8;
      --muted: rgba(65, 62, 62, 0.6);
      --radius: 4px;
      --radius-sm: 2px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      padding: 20px;
    }
    .dashboard {
      max-width: 1400px;
      margin: 0 auto;
    }
    .page-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .page-header h1 { font-size: 16px; letter-spacing: 3px; font-weight: 400; margin-bottom: 6px; }
    .page-header p { font-size: 11px; color: var(--muted); }

    .graph-section {
      margin-bottom: 40px;
    }
    .graph-container {
      background: var(--bg);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .graph-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--fg);
      color: var(--bg);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 1px;
    }
    .graph-header .title { font-weight: 600; }
    .graph-header .subtitle { font-size: 10px; opacity: 0.7; }
    .graph-body { padding: 20px; background: var(--bg); }
    .graph-body svg { display: block; max-width: 100%; height: auto; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 12px 16px;
      font-size: 11px;
      justify-content: center;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-swatch { width: 12px; height: 12px; border-radius: var(--radius-sm); }

    .tooltip {
      position: fixed;
      background: rgba(245, 242, 235, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      min-width: 200px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 1000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .tooltip.visible { opacity: 1; }
    .tooltip-header {
      padding: 10px 14px;
      background: transparent;
      color: rgba(65, 62, 62, 0.9);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(65, 62, 62, 0.1);
    }
    .tooltip-body { padding: 12px 14px; }
    .tooltip-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 11px;
      color: rgba(65, 62, 62, 0.8);
    }
    .tooltip-row span:first-child { display: flex; align-items: center; gap: 8px; }
    .tooltip-swatch { width: 10px; height: 10px; border-radius: var(--radius-sm); }
    .bar { cursor: pointer; }

    .placeholder {
      background: var(--grid);
      border-radius: var(--radius);
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
    }
    .placeholder-title { font-weight: 600; margin-bottom: 8px; }

    .export-btn {
      font-family: inherit;
      font-size: 10px;
      padding: 6px 12px;
      border: none;
      background: rgba(255,255,255,0.2);
      color: var(--bg);
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: background 0.2s;
    }
    .export-btn:hover { background: rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="page-header">
      <h1>ABLATION STUDIES DASHBOARD</h1>
      <p>Standard vs Ablation Studies (Bernoulli ±1 SE)</p>
    </div>

    <!-- Graph 1: Main Ablation Study -->
    <div class="graph-section">
      <div class="graph-container">
        <div class="graph-header">
          <div>
            <span class="title">Standard vs Ablation Studies</span>
            <span class="subtitle"> — Bernoulli ±1 SE</span>
          </div>
          <button class="export-btn" onclick="exportSvg('graph1')">EXPORT SVG</button>
        </div>
        <div class="graph-body" id="graph1"></div>
        <div class="legend" id="legend1"></div>
      </div>
    </div>

    <!-- Graph 2: Placeholder -->
    <div class="graph-section">
      <div class="graph-container">
        <div class="graph-header">
          <div>
            <span class="title">Graph 2</span>
            <span class="subtitle"> — Awaiting Data</span>
          </div>
        </div>
        <div class="placeholder">
          <div class="placeholder-title">GRAPH PLACEHOLDER</div>
          <div>Add data to render this graph</div>
        </div>
      </div>
    </div>

    <!-- Graph 3: Placeholder -->
    <div class="graph-section">
      <div class="graph-container">
        <div class="graph-header">
          <div>
            <span class="title">Graph 3</span>
            <span class="subtitle"> — Awaiting Data</span>
          </div>
        </div>
        <div class="placeholder">
          <div class="placeholder-title">GRAPH PLACEHOLDER</div>
          <div>Add data to render this graph</div>
        </div>
      </div>
    </div>
  </div>

  <div class="tooltip" id="tooltip">
    <div class="tooltip-header" id="tooltipHeader"></div>
    <div class="tooltip-body" id="tooltipBody"></div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════════════
    // DATA: Standard vs Ablation Studies
    // ═══════════════════════════════════════════════════════════════════════
    const ABLATION_DATA = {
      title: 'Standard vs Ablation Studies',
      yAxisLabel: 'Success Rate',
      clusters: [
        { id: 'scrub_dish', name: 'EVAL: Scrub dish with sponge', points: [
          { label: 'Standard', value: 21 },
          { label: 'no_ego', value: 0 },
          { label: '10pct', value: 0 },
          { label: 'no_cap_upsample', value: 0 }
        ]},
        { id: 'closing_door', name: 'EVAL: Closing the sliding door', points: [
          { label: 'Standard', value: 52 },
          { label: 'no_ego', value: 34 },
          { label: '10pct', value: 21 },
          { label: 'no_cap_upsample', value: 21 }
        ]},
        { id: 'watering_can', name: 'EVAL: watering can', points: [
          { label: 'Standard', value: 52 },
          { label: 'no_ego', value: 34 },
          { label: '10pct', value: 28 },
          { label: 'no_cap_upsample', value: 25 }
        ]},
        { id: 'steam_shirt', name: 'EVAL: Steam the shirt', points: [
          { label: 'Standard', value: 95 },
          { label: 'no_ego', value: 26 },
          { label: '10pct', value: 73 },
          { label: 'no_cap_upsample', value: 33 }
        ]},
        { id: 'iron_shirt', name: 'EVAL: Iron shirt', points: [
          { label: 'Standard', value: 0 },
          { label: 'no_ego', value: 0 },
          { label: '10pct', value: 11 },
          { label: 'no_cap_upsample', value: 0 }
        ]},
        { id: 'pick_up_pot', name: 'EVAL: Pick up pot', points: [
          { label: 'Standard', value: 52 },
          { label: 'no_ego', value: 48 },
          { label: '10pct', value: 35 },
          { label: 'no_cap_upsample', value: 25 }
        ]},
        { id: 'pick_up_box', name: 'EVAL: Pick up box with both hands', points: [
          { label: 'Standard', value: 21 },
          { label: 'no_ego', value: 35 },
          { label: '10pct', value: 28 },
          { label: 'no_cap_upsample', value: 21 }
        ]},
        { id: 'pull_tissue', name: 'EVAL: Pull tissue', points: [
          { label: 'Standard', value: 52 },
          { label: 'no_ego', value: 35 },
          { label: '10pct', value: 21 },
          { label: 'no_cap_upsample', value: 21 }
        ]},
        { id: 'grab_chips', name: 'EVAL: Grab bag of chips', points: [
          { label: 'Standard', value: 85 },
          { label: 'no_ego', value: 70 },
          { label: '10pct', value: 98 },
          { label: 'no_cap_upsample', value: 70 }
        ]}
      ]
    };

    // Monochrome palette based on rgba(65, 62, 62)
    const COLORS = [
      'rgba(65, 62, 62, 1)',
      'rgba(65, 62, 62, 0.7)',
      'rgba(65, 62, 62, 0.45)',
      'rgba(65, 62, 62, 0.25)'
    ];

    const CONFIG = {
      width: 1200,
      height: 420,
      padding: { top: 40, right: 40, bottom: 100, left: 70 }
    };

    // ═══════════════════════════════════════════════════════════════════════
    // BAR CHART RENDERER
    // ═══════════════════════════════════════════════════════════════════════
    function renderBarChart(data, containerId) {
      const { width, height, padding } = CONFIG;
      const clusters = data.clusters;
      const chartW = width - padding.left - padding.right;
      const chartH = height - padding.top - padding.bottom;
      const maxVal = 100; // Success rate 0-100%
      const clusterW = chartW / clusters.length;
      const maxBars = Math.max(...clusters.map(c => c.points.length));
      const barW = Math.max(8, (clusterW - 24) / maxBars - 3);

      let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
      svg += `<rect width="100%" height="100%" fill="#f5f5f5" rx="4"/>`;

      // Y-axis label
      svg += `<text x="20" y="${height/2}" text-anchor="middle" fill="rgba(65,62,62,0.6)" font-family="monospace" font-size="10" transform="rotate(-90, 20, ${height/2})">${data.yAxisLabel}</text>`;

      // Grid lines and Y-axis labels
      for (let i = 0; i <= 10; i++) {
        const y = padding.top + (i / 10) * chartH;
        const val = (100 - (i / 10) * 100) / 100;
        svg += `<line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="#e0e0e0" stroke-width="0.5"/>`;
        svg += `<text x="${padding.left - 12}" y="${y + 4}" text-anchor="end" fill="rgba(65,62,62,0.5)" font-family="monospace" font-size="9">${val.toFixed(1)}</text>`;
      }

      // Bars
      clusters.forEach((cluster, ci) => {
        const cx = padding.left + (ci + 0.5) * clusterW;
        const startX = cx - (cluster.points.length * (barW + 3)) / 2;

        cluster.points.forEach((pt, pi) => {
          const barH = (pt.value / maxVal) * chartH;
          const x = startX + pi * (barW + 3);
          const y = height - padding.bottom - barH;
          svg += `<rect class="bar" data-cluster="${cluster.id}" data-idx="${pi}" x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${COLORS[pi % COLORS.length]}" rx="2" ry="2"/>`;
        });

        // X-axis labels (rotated)
        const labelX = cx;
        const labelY = height - padding.bottom + 12;
        svg += `<text x="${labelX}" y="${labelY}" text-anchor="start" fill="rgba(65,62,62,0.7)" font-family="monospace" font-size="8" transform="rotate(45, ${labelX}, ${labelY})">${cluster.name}</text>`;
      });

      // Axes
      svg += `<line x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${height - padding.bottom}" stroke="rgba(65,62,62,0.3)" stroke-width="1"/>`;
      svg += `<line x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}" stroke="rgba(65,62,62,0.3)" stroke-width="1"/>`;

      svg += '</svg>';

      document.getElementById(containerId).innerHTML = svg;

      // Attach event listeners
      document.querySelectorAll(`#${containerId} .bar`).forEach(bar => {
        bar.addEventListener('mouseenter', (e) => showTooltip(e, data));
        bar.addEventListener('mousemove', moveTooltip);
        bar.addEventListener('mouseleave', hideTooltip);
      });
    }

    // ═══════════════════════════════════════════════════════════════════════
    // LEGEND
    // ═══════════════════════════════════════════════════════════════════════
    function renderLegend(data, containerId) {
      const legendEl = document.getElementById(containerId);
      legendEl.innerHTML = data.clusters[0].points.map((pt, i) =>
        `<div class="legend-item"><div class="legend-swatch" style="background:${COLORS[i % COLORS.length]}"></div><span>${pt.label}</span></div>`
      ).join('');
    }

    // ═══════════════════════════════════════════════════════════════════════
    // TOOLTIP
    // ═══════════════════════════════════════════════════════════════════════
    function showTooltip(e, data) {
      const clusterId = e.target.getAttribute('data-cluster');
      const cluster = data.clusters.find(c => c.id === clusterId);
      if (!cluster) return;

      document.getElementById('tooltipHeader').textContent = cluster.name;
      document.getElementById('tooltipBody').innerHTML = cluster.points.map((pt, i) =>
        `<div class="tooltip-row"><span><div class="tooltip-swatch" style="background:${COLORS[i % COLORS.length]}"></div>${pt.label}</span><strong>${(pt.value / 100).toFixed(2)}</strong></div>`
      ).join('');

      document.getElementById('tooltip').classList.add('visible');
    }

    function moveTooltip(e) {
      const tooltip = document.getElementById('tooltip');
      tooltip.style.left = (e.clientX + 15) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
    }

    function hideTooltip() {
      document.getElementById('tooltip').classList.remove('visible');
    }

    // ═══════════════════════════════════════════════════════════════════════
    // EXPORT
    // ═══════════════════════════════════════════════════════════════════════
    function exportSvg(containerId) {
      const svg = document.querySelector(`#${containerId} svg`);
      if (!svg) return;
      const blob = new Blob([svg.outerHTML], { type: 'image/svg+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${containerId}-chart.svg`;
      a.click();
    }

    // ═══════════════════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════════════════
    renderBarChart(ABLATION_DATA, 'graph1');
    renderLegend(ABLATION_DATA, 'legend1');
  </script>
</body>
</html>
