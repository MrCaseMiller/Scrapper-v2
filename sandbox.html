<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ablation Studies - Graph Dashboard</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --fg: rgba(65, 62, 62, 1);
      --grid: #e8e8e8;
      --muted: rgba(65, 62, 62, 0.6);
      --radius: 4px;
      --radius-sm: 2px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      padding: 20px;
    }
    .dashboard {
      max-width: 1020px;
      margin: 0 auto;
    }
    .page-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .page-header h1 { font-size: 16px; letter-spacing: 3px; font-weight: 400; margin-bottom: 6px; }
    .page-header p { font-size: 11px; color: var(--muted); }

    .graph-section {
      margin-bottom: 40px;
    }
    .graph-container {
      background: var(--bg);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .graph-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--fg);
      color: var(--bg);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 1px;
    }
    .graph-header .title { font-weight: 600; }
    .graph-header .subtitle { font-size: 10px; opacity: 0.7; }
    .graph-body { padding: 20px; background: var(--bg); }
    .graph-body svg { display: block; max-width: 100%; height: auto; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 12px 16px;
      font-size: 11px;
      justify-content: center;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-swatch { width: 12px; height: 12px; border-radius: var(--radius-sm); }

    .tooltip {
      position: fixed;
      background: rgba(120, 115, 100, 0.55);
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      min-width: 200px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 1000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
    }
    .tooltip.visible { opacity: 1; }
    .tooltip-header {
      padding: 12px 16px 8px;
      background: transparent;
      color: rgba(255, 255, 255, 0.95);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
    }
    .tooltip-body { padding: 10px 16px 14px; }
    .tooltip-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.85);
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
    }
    .tooltip-row span:first-child { display: flex; align-items: center; gap: 8px; }
    .tooltip-swatch { width: 10px; height: 10px; border-radius: var(--radius-sm); }
    .bar { cursor: pointer; }

    .placeholder {
      background: var(--grid);
      border-radius: var(--radius);
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
    }
    .placeholder-title { font-weight: 600; margin-bottom: 8px; }

    .export-btn {
      font-family: inherit;
      font-size: 10px;
      padding: 6px 12px;
      border: none;
      background: rgba(255,255,255,0.2);
      color: var(--bg);
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: background 0.2s;
    }
    .export-btn:hover { background: rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="page-header">
      <h1>ABLATION STUDIES DASHBOARD</h1>
      <p>Standard vs Ablation Studies (Bernoulli ±1 SE)</p>
    </div>

    <!-- Graph 1: Main Ablation Study -->
    <div class="graph-section">
      <div class="graph-container">
        <div class="graph-header">
          <div>
            <span class="title">Standard vs Ablation Studies</span>
            <span class="subtitle"> — Bernoulli ±1 SE</span>
          </div>
          <button class="export-btn" onclick="exportSvg('graph1')">EXPORT SVG</button>
        </div>
        <div class="graph-body" id="graph1"></div>
        <div class="legend" id="legend1"></div>
      </div>
    </div>

    <!-- Graph 2: Delta Performance -->
    <div class="graph-section">
      <div class="graph-container">
        <div class="graph-header">
          <div>
            <span class="title">Ablation Delta Performance vs Standard</span>
            <span class="subtitle"> — ±1 SE</span>
          </div>
          <button class="export-btn" onclick="exportSvg('graph2')">EXPORT SVG</button>
        </div>
        <div class="graph-body" id="graph2"></div>
        <div class="legend" id="legend2"></div>
      </div>
    </div>

    <!-- Graph 3: Standard Model Success Rate -->
    <div class="graph-section">
      <div class="graph-container">
        <div class="graph-header">
          <div>
            <span class="title">Standard Model Success Rate by Task</span>
            <span class="subtitle"> — ±1 SE</span>
          </div>
          <button class="export-btn" onclick="exportSvg('graph3')">EXPORT SVG</button>
        </div>
        <div class="graph-body" id="graph3"></div>
        <div class="legend" id="legend3"></div>
      </div>
    </div>
  </div>

  <div class="tooltip" id="tooltip">
    <div class="tooltip-header" id="tooltipHeader"></div>
    <div class="tooltip-body" id="tooltipBody"></div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════════════
    // DATA: Standard vs Ablation Studies
    // ═══════════════════════════════════════════════════════════════════════
    // DATA SOURCE: WM Dec 2025 Blog Post Figures - success_rate_and_ablation.csv
    // Note: "Iron shirt" excluded (only has 10pct data)
    // ═══════════════════════════════════════════════════════════════════════
    const ABLATION_DATA = {
      title: 'Standard vs Ablation Studies',
      yAxisLabel: 'Success Rate',
      clusters: [
        { id: 'closing_door', name: 'Closing the sliding door', points: [
          { label: 'Standard', value: 76.7 },
          { label: 'no_ego', value: 36.7 },
          { label: '10pct', value: 36.7 },
          { label: 'no_cap_upsample', value: 20 }
        ]},
        { id: 'grab_chips', name: 'Grab bag of chips', points: [
          { label: 'Standard', value: 80 },
          { label: 'no_ego', value: 80 },
          { label: '10pct', value: 96.7 },
          { label: 'no_cap_upsample', value: 73.3 }
        ]},
        { id: 'pick_up_box', name: 'Pick up box with both hands', points: [
          { label: 'Standard', value: 20 },
          { label: 'no_ego', value: 36 },
          { label: '10pct', value: 46.7 },
          { label: 'no_cap_upsample', value: 0 }
        ]},
        { id: 'pull_tissue', name: 'Pull tissue', points: [
          { label: 'Standard', value: 50 },
          { label: 'no_ego', value: 26.7 },
          { label: '10pct', value: 60 },
          { label: 'no_cap_upsample', value: 0 }
        ]},
        { id: 'scrub_dish', name: 'Scrub dish with sponge', points: [
          { label: 'Standard', value: 20 },
          { label: 'no_ego', value: 0 },
          { label: '10pct', value: 0 },
          { label: 'no_cap_upsample', value: 0 }
        ]},
        { id: 'steam_shirt', name: 'Steam the shirt', points: [
          { label: 'Standard', value: 93.3 },
          { label: 'no_ego', value: 33.3 },
          { label: '10pct', value: 73.3 },
          { label: 'no_cap_upsample', value: 0 }
        ]},
        { id: 'watering_can', name: 'Watering can', points: [
          { label: 'Standard', value: 60 },
          { label: 'no_ego', value: 20 },
          { label: '10pct', value: 30 },
          { label: 'no_cap_upsample', value: 60 }
        ]}
      ]
    };

    // Monochrome palette based on rgba(65, 62, 62)
    // ═══════════════════════════════════════════════════════════════════════
    // DATA: Delta Performance (from CSV delta columns)
    // ═══════════════════════════════════════════════════════════════════════
    const DELTA_DATA = {
      title: 'Ablation Delta Performance vs Standard',
      yAxisLabel: 'Δ Success Rate vs Standard',
      clusters: [
        { id: 'closing_door', name: 'Closing the sliding door', points: [
          { label: 'no_ego - Standard', value: -40 },
          { label: '10pct - Standard', value: -40 },
          { label: 'no_cap_upsample - Standard', value: -56.7 }
        ]},
        { id: 'grab_chips', name: 'Grab bag of chips', points: [
          { label: 'no_ego - Standard', value: 0 },
          { label: '10pct - Standard', value: 16.7 },
          { label: 'no_cap_upsample - Standard', value: -6.7 }
        ]},
        { id: 'pick_up_box', name: 'Pick up box with both hands', points: [
          { label: 'no_ego - Standard', value: 16 },
          { label: '10pct - Standard', value: 26.7 },
          { label: 'no_cap_upsample - Standard', value: 0 }
        ]},
        { id: 'pull_tissue', name: 'Pull tissue', points: [
          { label: 'no_ego - Standard', value: -23.3 },
          { label: '10pct - Standard', value: 10 },
          { label: 'no_cap_upsample - Standard', value: -50 }
        ]},
        { id: 'scrub_dish', name: 'Scrub dish with sponge', points: [
          { label: 'no_ego - Standard', value: -20 },
          { label: '10pct - Standard', value: -20 },
          { label: 'no_cap_upsample - Standard', value: -20 }
        ]},
        { id: 'steam_shirt', name: 'Steam the shirt', points: [
          { label: 'no_ego - Standard', value: -60 },
          { label: '10pct - Standard', value: -20 },
          { label: 'no_cap_upsample - Standard', value: 0 }
        ]},
        { id: 'watering_can', name: 'Watering can', points: [
          { label: 'no_ego - Standard', value: -40 },
          { label: '10pct - Standard', value: -30 },
          { label: 'no_cap_upsample - Standard', value: 0 }
        ]}
      ]
    };

    // ═══════════════════════════════════════════════════════════════════════
    // DATA: Standard Model Success Rate (from CSV success_rate_Standard)
    // ═══════════════════════════════════════════════════════════════════════
    const STANDARD_DATA = {
      title: 'Standard Model Success Rate by Task',
      yAxisLabel: 'Success Rate',
      clusters: [
        { id: 'closing_door', name: 'Closing the sliding door', points: [
          { label: 'Standard', value: 76.7 }
        ]},
        { id: 'grab_chips', name: 'Grab bag of chips', points: [
          { label: 'Standard', value: 80 }
        ]},
        { id: 'pick_up_box', name: 'Pick up box with both hands', points: [
          { label: 'Standard', value: 20 }
        ]},
        { id: 'pull_tissue', name: 'Pull tissue', points: [
          { label: 'Standard', value: 50 }
        ]},
        { id: 'scrub_dish', name: 'Scrub dish with sponge', points: [
          { label: 'Standard', value: 20 }
        ]},
        { id: 'steam_shirt', name: 'Steam the shirt', points: [
          { label: 'Standard', value: 93.3 }
        ]},
        { id: 'watering_can', name: 'Watering can', points: [
          { label: 'Standard', value: 60 }
        ]}
      ]
    };

    // Monochrome palette based on rgba(65, 62, 62)
    const COLORS = [
      'rgba(65, 62, 62, 1)',
      'rgba(65, 62, 62, 0.7)',
      'rgba(65, 62, 62, 0.45)',
      'rgba(65, 62, 62, 0.25)'
    ];

    // Delta chart colors (3 series only)
    const DELTA_COLORS = [
      'rgba(65, 62, 62, 0.7)',
      'rgba(65, 62, 62, 0.45)',
      'rgba(65, 62, 62, 0.25)'
    ];

    const CONFIG = {
      width: 960,
      height: 360,
      padding: { top: 30, right: 30, bottom: 65, left: 55 }
    };

    // ═══════════════════════════════════════════════════════════════════════
    // TEXT WRAPPING HELPER
    // ═══════════════════════════════════════════════════════════════════════
    function wrapText(text, x, y, maxWidth, lineHeight = 10) {
      const words = text.split(' ');
      const lines = [];
      let currentLine = '';

      // Approximate: ~6px per character at font-size 8
      const charWidth = 5;
      const maxChars = Math.floor(maxWidth / charWidth);

      words.forEach(word => {
        const testLine = currentLine ? currentLine + ' ' + word : word;
        if (testLine.length > maxChars && currentLine) {
          lines.push(currentLine);
          currentLine = word;
        } else {
          currentLine = testLine;
        }
      });
      if (currentLine) lines.push(currentLine);

      // Center vertically around y
      const startY = y - ((lines.length - 1) * lineHeight) / 2;

      return lines.map((line, i) =>
        `<tspan x="${x}" dy="${i === 0 ? 0 : lineHeight}">${line}</tspan>`
      ).join('');
    }

    // ═══════════════════════════════════════════════════════════════════════
    // BAR CHART RENDERER
    // ═══════════════════════════════════════════════════════════════════════
    function renderBarChart(data, containerId) {
      const { width, height, padding } = CONFIG;
      const clusters = data.clusters;
      const chartW = width - padding.left - padding.right;
      const chartH = height - padding.top - padding.bottom;
      const maxVal = 100; // Success rate 0-100%
      const clusterW = chartW / clusters.length;
      const maxBars = Math.max(...clusters.map(c => c.points.length));
      const barW = Math.max(4, (clusterW - 20) / maxBars - 4);

      let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
      svg += `<rect width="100%" height="100%" fill="#f5f5f5" rx="4"/>`;

      // Y-axis label
      svg += `<text x="20" y="${height/2}" text-anchor="middle" fill="rgba(65,62,62,0.6)" font-family="monospace" font-size="10" transform="rotate(-90, 20, ${height/2})">${data.yAxisLabel}</text>`;

      // Grid lines and Y-axis labels
      for (let i = 0; i <= 10; i++) {
        const y = padding.top + (i / 10) * chartH;
        const val = (100 - (i / 10) * 100) / 100;
        svg += `<line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="#e0e0e0" stroke-width="0.5"/>`;
        svg += `<text x="${padding.left - 12}" y="${y + 4}" text-anchor="end" fill="rgba(65,62,62,0.5)" font-family="monospace" font-size="9">${val.toFixed(1)}</text>`;
      }

      // Bars
      clusters.forEach((cluster, ci) => {
        const cx = padding.left + (ci + 0.5) * clusterW;
        const startX = cx - (cluster.points.length * (barW + 2)) / 2;

        cluster.points.forEach((pt, pi) => {
          const barH = (pt.value / maxVal) * chartH;
          const x = startX + pi * (barW + 2);
          const y = height - padding.bottom - barH;
          svg += `<rect class="bar" data-cluster="${cluster.id}" data-idx="${pi}" x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${COLORS[pi % COLORS.length]}" rx="2" ry="2"/>`;
        });

        // X-axis labels (wrapped, centered)
        svg += `<text x="${cx}" y="${height - padding.bottom + 15}" text-anchor="middle" fill="rgba(65,62,62,0.7)" font-family="monospace" font-size="8">${wrapText(cluster.name, cx, height - padding.bottom + 15, clusterW - 8)}</text>`;
      });

      // Axes
      svg += `<line x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${height - padding.bottom}" stroke="rgba(65,62,62,0.3)" stroke-width="1"/>`;
      svg += `<line x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}" stroke="rgba(65,62,62,0.3)" stroke-width="1"/>`;

      svg += '</svg>';

      document.getElementById(containerId).innerHTML = svg;

      // Attach event listeners
      document.querySelectorAll(`#${containerId} .bar`).forEach(bar => {
        bar.addEventListener('mouseenter', (e) => showTooltip(e, data));
        bar.addEventListener('mousemove', moveTooltip);
        bar.addEventListener('mouseleave', hideTooltip);
      });
    }

    // ═══════════════════════════════════════════════════════════════════════
    // DELTA BAR CHART RENDERER (diverging from zero baseline)
    // ═══════════════════════════════════════════════════════════════════════
    function renderDeltaChart(data, containerId) {
      const { width, height, padding } = CONFIG;
      const clusters = data.clusters;
      const chartW = width - padding.left - padding.right;
      const chartH = height - padding.top - padding.bottom;

      // Find actual min/max for asymmetric scale
      const allVals = clusters.flatMap(c => c.points.map(p => p.value));
      const minVal = Math.floor(Math.min(...allVals) / 10) * 10; // Round down (e.g., -69 → -70)
      const maxVal = Math.ceil(Math.max(...allVals) / 10) * 10;  // Round up (e.g., 14 → 20)
      const range = maxVal - minVal;

      const clusterW = chartW / clusters.length;
      // Use 4 bars to match Graph 1 bar width
      const barW = Math.max(4, (clusterW - 20) / 4 - 4);

      // Zero line position (proportional to data range)
      const zeroY = padding.top + (maxVal / range) * chartH;

      let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
      svg += `<rect width="100%" height="100%" fill="#f5f5f5" rx="4"/>`;

      // Y-axis label
      svg += `<text x="20" y="${height/2}" text-anchor="middle" fill="rgba(65,62,62,0.6)" font-family="monospace" font-size="10" transform="rotate(-90, 20, ${height/2})">${data.yAxisLabel}</text>`;

      // Grid lines and Y-axis labels (asymmetric scale)
      const steps = 9;
      for (let i = 0; i <= steps; i++) {
        const y = padding.top + (i / steps) * chartH;
        const val = (maxVal - (i / steps) * range) / 100;
        const isZeroLine = Math.abs(val) < 0.01;
        svg += `<line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="${isZeroLine ? 'rgba(65,62,62,0.4)' : '#e0e0e0'}" stroke-width="${isZeroLine ? '1' : '0.5'}"/>`;
        svg += `<text x="${padding.left - 12}" y="${y + 4}" text-anchor="end" fill="rgba(65,62,62,0.5)" font-family="monospace" font-size="9">${val.toFixed(1)}</text>`;
      }

      // Bars
      clusters.forEach((cluster, ci) => {
        const cx = padding.left + (ci + 0.5) * clusterW;
        const startX = cx - (cluster.points.length * (barW + 2)) / 2;

        cluster.points.forEach((pt, pi) => {
          const barH = Math.abs(pt.value / range) * chartH;
          const x = startX + pi * (barW + 2);
          const y = pt.value >= 0 ? zeroY - barH : zeroY;
          svg += `<rect class="bar" data-cluster="${cluster.id}" data-idx="${pi}" data-type="delta" x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${DELTA_COLORS[pi % DELTA_COLORS.length]}" rx="2" ry="2"/>`;
        });

        // X-axis labels (wrapped, centered)
        svg += `<text x="${cx}" y="${height - padding.bottom + 15}" text-anchor="middle" fill="rgba(65,62,62,0.7)" font-family="monospace" font-size="8">${wrapText(cluster.name, cx, height - padding.bottom + 15, clusterW - 8)}</text>`;
      });

      // Axes
      svg += `<line x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${height - padding.bottom}" stroke="rgba(65,62,62,0.3)" stroke-width="1"/>`;
      svg += `<line x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}" stroke="rgba(65,62,62,0.3)" stroke-width="1"/>`;

      svg += '</svg>';

      document.getElementById(containerId).innerHTML = svg;

      // Attach event listeners
      document.querySelectorAll(`#${containerId} .bar`).forEach(bar => {
        bar.addEventListener('mouseenter', (e) => showDeltaTooltip(e, data));
        bar.addEventListener('mousemove', moveTooltip);
        bar.addEventListener('mouseleave', hideTooltip);
      });
    }

    // ═══════════════════════════════════════════════════════════════════════
    // SINGLE BAR CHART RENDERER (one bar per cluster)
    // ═══════════════════════════════════════════════════════════════════════
    function renderSingleBarChart(data, containerId) {
      const { width, height, padding } = CONFIG;
      const clusters = data.clusters;
      const chartW = width - padding.left - padding.right;
      const chartH = height - padding.top - padding.bottom;
      const maxVal = 100; // Success rate 0-100%
      const clusterW = chartW / clusters.length;
      // Use consistent bar width matching other charts
      const barW = Math.max(4, (clusterW - 20) / 4 - 4);

      let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
      svg += `<rect width="100%" height="100%" fill="#f5f5f5" rx="4"/>`;

      // Y-axis label
      svg += `<text x="20" y="${height/2}" text-anchor="middle" fill="rgba(65,62,62,0.6)" font-family="monospace" font-size="10" transform="rotate(-90, 20, ${height/2})">${data.yAxisLabel}</text>`;

      // Grid lines and Y-axis labels
      for (let i = 0; i <= 10; i++) {
        const y = padding.top + (i / 10) * chartH;
        const val = (100 - (i / 10) * 100) / 100;
        svg += `<line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="#e0e0e0" stroke-width="0.5"/>`;
        svg += `<text x="${padding.left - 12}" y="${y + 4}" text-anchor="end" fill="rgba(65,62,62,0.5)" font-family="monospace" font-size="9">${val.toFixed(1)}</text>`;
      }

      // Bars (single bar per cluster, centered)
      clusters.forEach((cluster, ci) => {
        const cx = padding.left + (ci + 0.5) * clusterW;
        const pt = cluster.points[0];
        const barH = (pt.value / maxVal) * chartH;
        const x = cx - barW / 2;
        const y = height - padding.bottom - barH;
        svg += `<rect class="bar" data-cluster="${cluster.id}" data-idx="0" x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${COLORS[0]}" rx="2" ry="2"/>`;

        // X-axis labels (wrapped, centered)
        svg += `<text x="${cx}" y="${height - padding.bottom + 15}" text-anchor="middle" fill="rgba(65,62,62,0.7)" font-family="monospace" font-size="8">${wrapText(cluster.name, cx, height - padding.bottom + 15, clusterW - 8)}</text>`;
      });

      // Axes
      svg += `<line x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${height - padding.bottom}" stroke="rgba(65,62,62,0.3)" stroke-width="1"/>`;
      svg += `<line x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}" stroke="rgba(65,62,62,0.3)" stroke-width="1"/>`;

      svg += '</svg>';

      document.getElementById(containerId).innerHTML = svg;

      // Attach event listeners
      document.querySelectorAll(`#${containerId} .bar`).forEach(bar => {
        bar.addEventListener('mouseenter', (e) => showSingleTooltip(e, data));
        bar.addEventListener('mousemove', moveTooltip);
        bar.addEventListener('mouseleave', hideTooltip);
      });
    }

    // ═══════════════════════════════════════════════════════════════════════
    // LEGEND
    // ═══════════════════════════════════════════════════════════════════════
    function renderLegend(data, containerId) {
      const legendEl = document.getElementById(containerId);
      legendEl.innerHTML = data.clusters[0].points.map((pt, i) =>
        `<div class="legend-item"><div class="legend-swatch" style="background:${COLORS[i % COLORS.length]}"></div><span>${pt.label}</span></div>`
      ).join('');
    }

    function renderDeltaLegend(data, containerId) {
      const legendEl = document.getElementById(containerId);
      legendEl.innerHTML = data.clusters[0].points.map((pt, i) =>
        `<div class="legend-item"><div class="legend-swatch" style="background:${DELTA_COLORS[i % DELTA_COLORS.length]}"></div><span>${pt.label}</span></div>`
      ).join('');
    }

    // ═══════════════════════════════════════════════════════════════════════
    // TOOLTIP
    // ═══════════════════════════════════════════════════════════════════════
    function showTooltip(e, data) {
      const clusterId = e.target.getAttribute('data-cluster');
      const cluster = data.clusters.find(c => c.id === clusterId);
      if (!cluster) return;

      document.getElementById('tooltipHeader').textContent = cluster.name;
      document.getElementById('tooltipBody').innerHTML = cluster.points.map((pt, i) =>
        `<div class="tooltip-row"><span><div class="tooltip-swatch" style="background:${COLORS[i % COLORS.length]}"></div>${pt.label}</span><strong>${(pt.value / 100).toFixed(2)}</strong></div>`
      ).join('');

      document.getElementById('tooltip').classList.add('visible');
    }

    function moveTooltip(e) {
      const tooltip = document.getElementById('tooltip');
      tooltip.style.left = (e.clientX + 15) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
    }

    function hideTooltip() {
      document.getElementById('tooltip').classList.remove('visible');
    }

    function showDeltaTooltip(e, data) {
      const clusterId = e.target.getAttribute('data-cluster');
      const cluster = data.clusters.find(c => c.id === clusterId);
      if (!cluster) return;

      document.getElementById('tooltipHeader').textContent = cluster.name;
      document.getElementById('tooltipBody').innerHTML = cluster.points.map((pt, i) =>
        `<div class="tooltip-row"><span><div class="tooltip-swatch" style="background:${DELTA_COLORS[i % DELTA_COLORS.length]}"></div>${pt.label}</span><strong>${pt.value >= 0 ? '+' : ''}${(pt.value / 100).toFixed(2)}</strong></div>`
      ).join('');

      document.getElementById('tooltip').classList.add('visible');
    }

    function showSingleTooltip(e, data) {
      const clusterId = e.target.getAttribute('data-cluster');
      const cluster = data.clusters.find(c => c.id === clusterId);
      if (!cluster) return;

      document.getElementById('tooltipHeader').textContent = cluster.name;
      document.getElementById('tooltipBody').innerHTML = cluster.points.map((pt, i) =>
        `<div class="tooltip-row"><span><div class="tooltip-swatch" style="background:${COLORS[0]}"></div>${pt.label}</span><strong>${(pt.value / 100).toFixed(2)}</strong></div>`
      ).join('');

      document.getElementById('tooltip').classList.add('visible');
    }

    // ═══════════════════════════════════════════════════════════════════════
    // EXPORT
    // ═══════════════════════════════════════════════════════════════════════
    function exportSvg(containerId) {
      const svg = document.querySelector(`#${containerId} svg`);
      if (!svg) return;
      const blob = new Blob([svg.outerHTML], { type: 'image/svg+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${containerId}-chart.svg`;
      a.click();
    }

    // ═══════════════════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════════════════
    renderBarChart(ABLATION_DATA, 'graph1');
    renderLegend(ABLATION_DATA, 'legend1');

    renderDeltaChart(DELTA_DATA, 'graph2');
    renderDeltaLegend(DELTA_DATA, 'legend2');

    renderSingleBarChart(STANDARD_DATA, 'graph3');
    renderLegend(STANDARD_DATA, 'legend3');
  </script>
</body>
</html>
