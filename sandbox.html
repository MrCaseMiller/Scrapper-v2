<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRUTALIST GRAPH - SANDBOX</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --fg: #1a1a1a;
      --grid: #e0e0e0;
      --muted: #666;
    }
    [data-theme="dark"] {
      --bg: #1a1a1a;
      --fg: #f5f5f5;
      --grid: #333;
      --muted: #999;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
    }
    .header {
      background: var(--fg);
      color: var(--bg);
      padding: 20px;
      text-align: center;
      border-bottom: 4px solid var(--fg);
    }
    .header h1 { font-size: 18px; letter-spacing: 4px; }
    .header p { font-size: 11px; color: var(--muted); margin-top: 8px; }
    .toolbar {
      display: flex;
      gap: 12px;
      padding: 12px 20px;
      background: #e8e8e8;
      border-bottom: 3px solid var(--fg);
      flex-wrap: wrap;
    }
    [data-theme="dark"] .toolbar { background: #2a2a2a; }
    .toolbar label { font-size: 11px; font-weight: bold; letter-spacing: 1px; }
    .toolbar select, .toolbar button {
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      padding: 8px 16px;
      border: 2px solid var(--fg);
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
      text-transform: uppercase;
    }
    .toolbar button:hover { background: var(--fg); color: var(--bg); }
    .toolbar button.active { background: var(--fg); color: var(--bg); }
    .graph-container {
      margin: 20px;
      background: #fff;
      border: 3px solid var(--fg);
      box-shadow: 4px 4px 0 var(--fg);
    }
    [data-theme="dark"] .graph-container { background: #222; }
    .graph-header {
      display: flex;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--fg);
      color: var(--bg);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .graph-body { padding: 20px; background: var(--grid); }
    .graph-body svg { display: block; max-width: 100%; height: auto; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 12px 16px;
      border-top: 2px solid var(--fg);
      font-size: 11px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-swatch { width: 14px; height: 14px; border: 2px solid var(--fg); }
    .tooltip {
      position: fixed;
      background: var(--bg);
      border: 3px solid var(--fg);
      box-shadow: 4px 4px 0 var(--fg);
      min-width: 180px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 1000;
    }
    .tooltip.visible { opacity: 1; }
    .tooltip-header {
      padding: 8px 12px;
      background: var(--fg);
      color: var(--bg);
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .tooltip-body { padding: 10px; }
    .tooltip-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      font-size: 11px;
    }
    .tooltip-row span:first-child { display: flex; align-items: center; gap: 6px; }
    .tooltip-swatch { width: 10px; height: 10px; border: 1px solid var(--fg); }
    .bar { cursor: pointer; transition: opacity 0.15s; }
    .bar:hover { opacity: 0.7; }
  </style>
</head>
<body>
  <div class="header">
    <h1>BRUTALIST GRAPH SYSTEM</h1>
    <p>SANDBOX TEST / STANDALONE HTML / NO BUILD REQUIRED</p>
  </div>

  <div class="toolbar">
    <div>
      <label>DATASET: </label>
      <select id="datasetSelect">
        <option value="ablation">ABLATION STUDY</option>
        <option value="performance">PERFORMANCE</option>
      </select>
    </div>
    <div>
      <label>STYLE: </label>
      <select id="styleSelect">
        <option value="bar">BAR</option>
        <option value="line">LINE</option>
        <option value="radar">RADAR</option>
        <option value="stacked">STACKED</option>
      </select>
    </div>
    <div>
      <button id="themeToggle">☾ DARK</button>
      <button id="exportSvg">EXPORT SVG</button>
    </div>
  </div>

  <div class="graph-container">
    <div class="graph-header">
      <span id="graphTitle">ABLATION STUDY RESULTS</span>
      <span>INTERACTIVE</span>
    </div>
    <div class="graph-body" id="graphBody"></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="tooltip" id="tooltip">
    <div class="tooltip-header" id="tooltipHeader"></div>
    <div class="tooltip-body" id="tooltipBody"></div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════════════
    //  MOCK DATA (Same as API server)
    // ═══════════════════════════════════════════════════════════════════════
    const DATASETS = {
      ablation: {
        title: 'ABLATION STUDY RESULTS',
        clusters: [
          { id: 'in_dist_follow', name: 'IN-DIST FOLLOW', points: [
            { label: 'π₀.₅', value: 85 }, { label: 'no WD', value: 84 },
            { label: 'no CE', value: 72 }, { label: 'no ME', value: 64 },
            { label: 'no ME/CE', value: 55 }
          ]},
          { id: 'in_dist_success', name: 'IN-DIST SUCCESS', points: [
            { label: 'π₀.₅', value: 80 }, { label: 'no WD', value: 79 },
            { label: 'no CE', value: 65 }, { label: 'no ME', value: 55 },
            { label: 'no ME/CE', value: 48 }
          ]},
          { id: 'ood_follow', name: 'OOD FOLLOW', points: [
            { label: 'π₀.₅', value: 94 }, { label: 'no WD', value: 80 },
            { label: 'no CE', value: 67 }, { label: 'no ME', value: 33 },
            { label: 'no ME/CE', value: 30 }
          ]},
          { id: 'ood_success', name: 'OOD SUCCESS', points: [
            { label: 'π₀.₅', value: 88 }, { label: 'no WD', value: 70 },
            { label: 'no CE', value: 48 }, { label: 'no ME', value: 32 },
            { label: 'no ME/CE', value: 28 }
          ]}
        ]
      },
      performance: {
        title: 'MODEL PERFORMANCE METRICS',
        clusters: [
          { id: 'accuracy', name: 'ACCURACY', points: [
            { label: 'Model A', value: 92 }, { label: 'Model B', value: 88 },
            { label: 'Model C', value: 85 }, { label: 'Model D', value: 79 },
            { label: 'Model E', value: 73 }, { label: 'Model F', value: 68 }
          ]},
          { id: 'latency', name: 'LATENCY (INV)', points: [
            { label: 'Model A', value: 45 }, { label: 'Model B', value: 78 },
            { label: 'Model C', value: 92 }, { label: 'Model D', value: 85 },
            { label: 'Model E', value: 88 }, { label: 'Model F', value: 95 }
          ]},
          { id: 'memory', name: 'MEMORY EFF', points: [
            { label: 'Model A', value: 60 }, { label: 'Model B', value: 72 },
            { label: 'Model C', value: 88 }, { label: 'Model D', value: 91 },
            { label: 'Model E', value: 85 }, { label: 'Model F', value: 78 }
          ]}
        ]
      }
    };

    const COLORS = ['#1a1a1a', '#404040', '#666666', '#8c8c8c', '#b3b3b3', '#d9d9d9'];
    const CONFIG = { width: 1000, height: 400, padding: { top: 40, right: 40, bottom: 70, left: 60 } };

    let currentDataset = 'ablation';
    let currentStyle = 'bar';
    let isDark = false;

    // ═══════════════════════════════════════════════════════════════════════
    //  RENDERERS
    // ═══════════════════════════════════════════════════════════════════════
    function renderBarChart(clusters) {
      const { width, height, padding } = CONFIG;
      const chartW = width - padding.left - padding.right;
      const chartH = height - padding.top - padding.bottom;
      const maxVal = Math.ceil(Math.max(...clusters.flatMap(c => c.points.map(p => p.value))) / 10) * 10;
      const clusterW = chartW / clusters.length;
      const maxBars = Math.max(...clusters.map(c => c.points.length));
      const barW = Math.max(10, (clusterW - 20) / maxBars - 4);

      let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
      svg += `<rect width="100%" height="100%" fill="${isDark ? '#222' : '#f5f5f5'}"/>`;

      // Grid
      for (let i = 0; i <= 10; i++) {
        const y = padding.top + (i / 10) * chartH;
        const val = maxVal - (i / 10) * maxVal;
        svg += `<line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="${isDark ? '#444' : '#ddd'}" stroke-width="1"/>`;
        svg += `<text x="${padding.left - 10}" y="${y + 4}" text-anchor="end" fill="${isDark ? '#999' : '#666'}" font-family="monospace" font-size="10">${val}%</text>`;
      }

      // Bars
      clusters.forEach((cluster, ci) => {
        const cx = padding.left + (ci + 0.5) * clusterW;
        const startX = cx - (cluster.points.length * (barW + 2)) / 2;

        cluster.points.forEach((pt, pi) => {
          const barH = (pt.value / maxVal) * chartH;
          const x = startX + pi * (barW + 2);
          const y = height - padding.bottom - barH;
          svg += `<rect class="bar" data-cluster="${cluster.id}" data-idx="${pi}" x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${COLORS[pi % COLORS.length]}" stroke="${isDark ? '#f5f5f5' : '#1a1a1a'}" stroke-width="1"/>`;
        });

        svg += `<text x="${cx}" y="${height - padding.bottom + 35}" text-anchor="middle" fill="${isDark ? '#f5f5f5' : '#1a1a1a'}" font-family="monospace" font-size="9" font-weight="bold">${cluster.name}</text>`;
      });

      // Axes
      svg += `<line x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${height - padding.bottom}" stroke="${isDark ? '#f5f5f5' : '#1a1a1a'}" stroke-width="2"/>`;
      svg += `<line x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}" stroke="${isDark ? '#f5f5f5' : '#1a1a1a'}" stroke-width="2"/>`;
      svg += '</svg>';
      return svg;
    }

    function renderLineChart(clusters) {
      const { width, height, padding } = CONFIG;
      const chartW = width - padding.left - padding.right;
      const chartH = height - padding.top - padding.bottom;
      const maxVal = Math.ceil(Math.max(...clusters.flatMap(c => c.points.map(p => p.value))) / 10) * 10;
      const pointSpacing = chartW / (clusters.length - 1 || 1);
      const numSeries = clusters[0]?.points.length || 0;

      let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
      svg += `<rect width="100%" height="100%" fill="${isDark ? '#222' : '#f5f5f5'}"/>`;

      // Grid
      for (let i = 0; i <= 10; i++) {
        const y = padding.top + (i / 10) * chartH;
        svg += `<line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="${isDark ? '#444' : '#ddd'}" stroke-width="1"/>`;
      }

      // Lines
      for (let si = 0; si < numSeries; si++) {
        let path = '';
        clusters.forEach((c, ci) => {
          const x = padding.left + ci * pointSpacing;
          const y = height - padding.bottom - (c.points[si].value / maxVal) * chartH;
          path += ci === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`;
        });
        svg += `<path d="${path}" fill="none" stroke="${COLORS[si % COLORS.length]}" stroke-width="3"/>`;

        clusters.forEach((c, ci) => {
          const x = padding.left + ci * pointSpacing;
          const y = height - padding.bottom - (c.points[si].value / maxVal) * chartH;
          svg += `<rect class="bar" data-cluster="${c.id}" data-idx="${si}" x="${x - 5}" y="${y - 5}" width="10" height="10" fill="${isDark ? '#222' : '#f5f5f5'}" stroke="${COLORS[si % COLORS.length]}" stroke-width="2"/>`;
        });
      }

      clusters.forEach((c, i) => {
        const x = padding.left + i * pointSpacing;
        svg += `<text x="${x}" y="${height - padding.bottom + 25}" text-anchor="middle" fill="${isDark ? '#f5f5f5' : '#1a1a1a'}" font-family="monospace" font-size="9" font-weight="bold">${c.name}</text>`;
      });

      svg += '</svg>';
      return svg;
    }

    function renderRadarChart(clusters) {
      const { width, height } = CONFIG;
      const cx = width / 2, cy = height / 2;
      const radius = Math.min(width, height) / 2 - 80;
      const numAxes = clusters.length;
      const angleStep = (2 * Math.PI) / numAxes;
      const numSeries = clusters[0]?.points.length || 0;

      let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
      svg += `<rect width="100%" height="100%" fill="${isDark ? '#222' : '#f5f5f5'}"/>`;

      // Grid circles
      for (let i = 1; i <= 5; i++) {
        const r = (radius / 5) * i;
        svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${isDark ? '#444' : '#ddd'}" stroke-width="1"/>`;
      }

      // Axis lines
      for (let i = 0; i < numAxes; i++) {
        const angle = i * angleStep - Math.PI / 2;
        const x = cx + radius * Math.cos(angle);
        const y = cy + radius * Math.sin(angle);
        svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${isDark ? '#444' : '#ddd'}" stroke-width="1"/>`;
      }

      // Polygons
      for (let si = 0; si < numSeries; si++) {
        let path = '';
        clusters.forEach((c, ci) => {
          const val = c.points[si].value;
          const angle = ci * angleStep - Math.PI / 2;
          const r = (val / 100) * radius;
          const x = cx + r * Math.cos(angle);
          const y = cy + r * Math.sin(angle);
          path += ci === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`;
        });
        path += ' Z';
        svg += `<path d="${path}" fill="${COLORS[si % COLORS.length]}" fill-opacity="0.15" stroke="${COLORS[si % COLORS.length]}" stroke-width="2"/>`;
      }

      // Labels
      clusters.forEach((c, i) => {
        const angle = i * angleStep - Math.PI / 2;
        const x = cx + (radius + 30) * Math.cos(angle);
        const y = cy + (radius + 30) * Math.sin(angle);
        svg += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" fill="${isDark ? '#f5f5f5' : '#1a1a1a'}" font-family="monospace" font-size="9" font-weight="bold">${c.name}</text>`;
      });

      svg += '</svg>';
      return svg;
    }

    function renderStackedChart(clusters) {
      const { width, height, padding } = CONFIG;
      const chartW = width - padding.left - padding.right;
      const chartH = height - padding.top - padding.bottom;
      const maxStacked = Math.max(...clusters.map(c => c.points.reduce((s, p) => s + p.value, 0)));
      const barW = (chartW / clusters.length) * 0.7;
      const barSpacing = (chartW / clusters.length) * 0.3;

      let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
      svg += `<rect width="100%" height="100%" fill="${isDark ? '#222' : '#f5f5f5'}"/>`;

      // Grid
      for (let i = 0; i <= 5; i++) {
        const y = padding.top + (i / 5) * chartH;
        svg += `<line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="${isDark ? '#444' : '#ddd'}" stroke-width="1"/>`;
      }

      clusters.forEach((c, ci) => {
        const x = padding.left + ci * (barW + barSpacing) + barSpacing / 2;
        let curY = height - padding.bottom;

        c.points.forEach((pt, pi) => {
          const segH = (pt.value / maxStacked) * chartH;
          const y = curY - segH;
          svg += `<rect class="bar" data-cluster="${c.id}" data-idx="${pi}" x="${x}" y="${y}" width="${barW}" height="${segH}" fill="${COLORS[pi % COLORS.length]}" stroke="${isDark ? '#f5f5f5' : '#1a1a1a'}" stroke-width="1"/>`;
          curY = y;
        });

        svg += `<text x="${x + barW / 2}" y="${height - padding.bottom + 25}" text-anchor="middle" fill="${isDark ? '#f5f5f5' : '#1a1a1a'}" font-family="monospace" font-size="9" font-weight="bold">${c.name}</text>`;
      });

      svg += '</svg>';
      return svg;
    }

    // ═══════════════════════════════════════════════════════════════════════
    //  RENDER & UPDATE
    // ═══════════════════════════════════════════════════════════════════════
    function render() {
      const data = DATASETS[currentDataset];
      document.getElementById('graphTitle').textContent = data.title;

      const renderers = { bar: renderBarChart, line: renderLineChart, radar: renderRadarChart, stacked: renderStackedChart };
      document.getElementById('graphBody').innerHTML = renderers[currentStyle](data.clusters);

      // Legend
      const legendEl = document.getElementById('legend');
      legendEl.innerHTML = data.clusters[0].points.map((pt, i) =>
        `<div class="legend-item"><div class="legend-swatch" style="background:${COLORS[i % COLORS.length]}"></div><span>${pt.label}</span></div>`
      ).join('');

      // Attach hover events
      document.querySelectorAll('.bar').forEach(bar => {
        bar.addEventListener('mouseenter', showTooltip);
        bar.addEventListener('mousemove', moveTooltip);
        bar.addEventListener('mouseleave', hideTooltip);
      });
    }

    function showTooltip(e) {
      const clusterId = e.target.getAttribute('data-cluster');
      const data = DATASETS[currentDataset];
      const cluster = data.clusters.find(c => c.id === clusterId);
      if (!cluster) return;

      document.getElementById('tooltipHeader').textContent = cluster.name;
      document.getElementById('tooltipBody').innerHTML = cluster.points.map((pt, i) =>
        `<div class="tooltip-row"><span><div class="tooltip-swatch" style="background:${COLORS[i % COLORS.length]}"></div>${pt.label}</span><strong>${pt.value}%</strong></div>`
      ).join('');

      document.getElementById('tooltip').classList.add('visible');
    }

    function moveTooltip(e) {
      const tooltip = document.getElementById('tooltip');
      tooltip.style.left = (e.clientX + 15) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
    }

    function hideTooltip() {
      document.getElementById('tooltip').classList.remove('visible');
    }

    // ═══════════════════════════════════════════════════════════════════════
    //  EVENT HANDLERS
    // ═══════════════════════════════════════════════════════════════════════
    document.getElementById('datasetSelect').addEventListener('change', e => {
      currentDataset = e.target.value;
      render();
    });

    document.getElementById('styleSelect').addEventListener('change', e => {
      currentStyle = e.target.value;
      render();
    });

    document.getElementById('themeToggle').addEventListener('click', () => {
      isDark = !isDark;
      document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.getElementById('themeToggle').textContent = isDark ? '☀ LIGHT' : '☾ DARK';
      render();
    });

    document.getElementById('exportSvg').addEventListener('click', () => {
      const svg = document.querySelector('#graphBody svg');
      if (!svg) return;
      const blob = new Blob([svg.outerHTML], { type: 'image/svg+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${currentDataset}-${currentStyle}.svg`;
      a.click();
    });

    // Initial render
    render();
  </script>
</body>
</html>
