<!DOCTYPE html>
<html>
<head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      font-size: 12px;
      color: #333;
      padding: 16px;
      background: #fff;
    }
    
    h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1a1a1a;
    }
    
    .section {
      margin-bottom: 16px;
    }
    
    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #666;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    textarea {
      width: 100%;
      height: 140px;
      padding: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1.5;
      resize: vertical;
      background: #fafafa;
    }
    
    textarea:focus {
      outline: none;
      border-color: #18a0fb;
      background: #fff;
    }
    
    .template-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    
    .template-btn {
      padding: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    
    .template-btn:hover {
      border-color: #18a0fb;
      background: #f5faff;
    }
    
    .template-btn.active {
      border-color: #18a0fb;
      background: #e8f4ff;
    }
    
    .template-btn .icon {
      font-size: 18px;
      margin-bottom: 2px;
    }
    
    .template-btn .name {
      font-size: 11px;
      font-weight: 500;
      color: #333;
    }
    
    /* Viewport Toggle */
    .viewport-toggle {
      display: flex;
      gap: 8px;
    }
    
    .viewport-btn {
      flex: 1;
      padding: 12px 8px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    
    .viewport-btn:hover {
      border-color: #18a0fb;
      background: #f5faff;
    }
    
    .viewport-btn.active {
      border-color: #18a0fb;
      background: #e8f4ff;
    }
    
    .viewport-btn .icon {
      font-size: 20px;
      margin-bottom: 4px;
    }
    
    .viewport-btn .name {
      font-size: 11px;
      font-weight: 600;
      color: #333;
    }
    
    .viewport-btn .size {
      font-size: 10px;
      color: #888;
      margin-top: 2px;
    }
    
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    
    button.primary {
      flex: 1;
      padding: 10px 16px;
      background: #18a0fb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    
    button.primary:hover {
      background: #0d8de5;
    }
    
    button.primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    button.secondary {
      padding: 10px 16px;
      background: #f5f5f5;
      color: #333;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    
    button.secondary:hover {
      background: #eee;
    }
    
    .message {
      padding: 10px;
      border-radius: 6px;
      margin-top: 12px;
      font-size: 11px;
    }
    
    .message.success {
      background: #e6f9ed;
      color: #1a7f37;
    }
    
    .message.error {
      background: #ffebe9;
      color: #cf222e;
    }
    
    .examples {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }
    
    .examples h3 {
      font-size: 11px;
      font-weight: 500;
      color: #666;
      margin-bottom: 8px;
    }
    
    .example-btn {
      display: inline-block;
      padding: 4px 8px;
      margin: 2px;
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
    }
    
    .example-btn:hover {
      background: #eee;
    }
  </style>
</head>
<body>
  <h2>JSON Design Generator</h2>
  
  <div class="section">
    <label>Paste JSON Data</label>
    <textarea id="jsonInput" placeholder='{
  "products": [
    { "name": "Product", "price": "$99" },
    { "name": "Another", "price": "$149" }
  ]
}'></textarea>
  </div>
  
  <div class="section">
    <label>Template</label>
    <div class="template-grid">
      <div class="template-btn active" data-template="auto">
        <div class="icon">✨</div>
        <div class="name">Auto Detect</div>
      </div>
      <div class="template-btn" data-template="cards">
        <div class="icon">▦</div>
        <div class="name">Cards Grid</div>
      </div>
      <div class="template-btn" data-template="list">
        <div class="icon">☰</div>
        <div class="name">List</div>
      </div>
      <div class="template-btn" data-template="table">
        <div class="icon">▤</div>
        <div class="name">Table</div>
      </div>
    </div>
  </div>
  
  <div class="section">
    <label>Viewport Size</label>
    <div class="viewport-toggle">
      <div class="viewport-btn active" data-viewport="desktop">
        <div class="icon">🖥️</div>
        <div class="name">Desktop</div>
        <div class="size">1200px</div>
      </div>
      <div class="viewport-btn" data-viewport="mobile">
        <div class="icon">📱</div>
        <div class="name">Mobile</div>
        <div class="size">375px</div>
      </div>
      <div class="viewport-btn" data-viewport="both">
        <div class="icon">🖥️📱</div>
        <div class="name">Both</div>
        <div class="size">Side by side</div>
      </div>
    </div>
  </div>
  
  <div class="btn-row">
    <button class="primary" id="generateBtn">Generate Design</button>
    <button class="secondary" id="cancelBtn">Close</button>
  </div>
  
  <div id="messageArea"></div>
  
  <div class="examples">
    <h3>Load Example</h3>
    <span class="example-btn" data-example="products">Products</span>
    <span class="example-btn" data-example="users">Users</span>
    <span class="example-btn" data-example="tasks">Tasks</span>
    <span class="example-btn" data-example="pricing">Pricing</span>
  </div>

  <script>
    // State
    var selectedTemplate = 'auto';
    var selectedViewport = 'desktop';
    
    // Template selection
    document.querySelectorAll('.template-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.template-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        selectedTemplate = btn.dataset.template;
      });
    });
    
    // Viewport selection
    document.querySelectorAll('.viewport-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.viewport-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        selectedViewport = btn.dataset.viewport;
      });
    });
    
    // Generate button
    document.getElementById('generateBtn').addEventListener('click', function() {
      var jsonInput = document.getElementById('jsonInput').value.trim();
      var messageArea = document.getElementById('messageArea');
      
      if (!jsonInput) {
        messageArea.innerHTML = '<div class="message error">Please paste some JSON data</div>';
        return;
      }
      
      try {
        var data = JSON.parse(jsonInput);
        
        // Send message based on viewport selection
        if (selectedViewport === 'both') {
          // Generate both versions
          parent.postMessage({ 
            pluginMessage: { 
              type: 'generate', 
              data: data,
              template: selectedTemplate,
              viewport: 'both'
            } 
          }, '*');
        } else {
          parent.postMessage({ 
            pluginMessage: { 
              type: 'generate', 
              data: data,
              template: selectedTemplate,
              viewport: selectedViewport
            } 
          }, '*');
        }
        
        messageArea.innerHTML = '<div class="message">Generating...</div>';
      } catch (e) {
        messageArea.innerHTML = '<div class="message error">Invalid JSON: ' + e.message + '</div>';
      }
    });
    
    // Cancel button
    document.getElementById('cancelBtn').addEventListener('click', function() {
      parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
    });
    
    // Example data
    var examples = {
      products: [
        { "name": "Wireless Headphones", "price": "$149", "description": "Premium sound quality" },
        { "name": "Smart Watch", "price": "$299", "description": "Fitness tracking" },
        { "name": "Bluetooth Speaker", "price": "$79", "description": "Portable design" },
        { "name": "USB-C Hub", "price": "$59", "description": "7-in-1 connectivity" }
      ],
      users: [
        { "name": "Sarah Chen", "role": "Designer", "status": "Active" },
        { "name": "Mike Johnson", "role": "Developer", "status": "Active" },
        { "name": "Emma Wilson", "role": "PM", "status": "Away" },
        { "name": "Alex Rivera", "role": "Engineer", "status": "Active" }
      ],
      tasks: [
        { "title": "Design review", "description": "Review new homepage mockups", "status": "In Progress" },
        { "title": "API integration", "description": "Connect payment gateway", "status": "Todo" },
        { "title": "User testing", "description": "Schedule sessions for next week", "status": "Done" }
      ],
      pricing: [
        { "plan": "Starter", "price": "$9/mo", "users": "1 user", "storage": "5 GB" },
        { "plan": "Pro", "price": "$29/mo", "users": "5 users", "storage": "50 GB" },
        { "plan": "Team", "price": "$79/mo", "users": "20 users", "storage": "200 GB" },
        { "plan": "Enterprise", "price": "Custom", "users": "Unlimited", "storage": "Unlimited" }
      ]
    };
    
    document.querySelectorAll('.example-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var example = examples[btn.dataset.example];
        document.getElementById('jsonInput').value = JSON.stringify(example, null, 2);
      });
    });
    
    // Listen for messages from plugin
    window.onmessage = function(event) {
      var msg = event.data.pluginMessage;
      var messageArea = document.getElementById('messageArea');
      
      if (msg.type === 'success') {
        messageArea.innerHTML = '<div class="message success">' + msg.message + '</div>';
      } else if (msg.type === 'error') {
        messageArea.innerHTML = '<div class="message error">' + msg.message + '</div>';
      }
    };
  </script>
</body>
</html>
